# On the server:  cd transport_app/deploy && docker compose up -d --build
services:
  app:
    build: ..
    restart: always
    volumes:
      - ./secrets.toml:/app/.streamlit/secrets.toml:ro     # your Streamlit secrets, copied to the server
  caddy:                                                   # free HTTPS (padlock) in front of the app
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
